name: VirtualMuseum-Backend

services:
  db:
    image: postgres:16-alpine
    container_name: VirtualMuseum-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: virtualmuseum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtualmuseum"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: VirtualMuseum-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
